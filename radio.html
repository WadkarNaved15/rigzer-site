<style>

<script>
(function(){
/* Keeps the page light: only what is on screen (or about to be) is allowed to move.
   Parked means the class rz-off, which pauses every CSS animation inside it (live.css). Two layers watch for it:
   1. the big blocks (hero, sections, rows, footer) are parked while they are more than a short way off screen;
   2. every element that carries a looping animation is watched on its own, so a tall block (or a big drawing) with one
      small moving piece only runs that piece while the piece itself is near the screen.
   The canvases, the video and the two embedded pages already stop themselves; this covers the CSS animation. */
if(!window.IntersectionObserver)return;
const OFF='rz-off',seen=new WeakSet(),blocks=[...document.querySelectorAll('.hdr,.p')];
const park=new IntersectionObserver(es=>{for(const e of es)e.target.classList.toggle(OFF,!e.isIntersecting)},{rootMargin:'120px 0px'});
const watch=el=>{if(el&&!seen.has(el)){seen.add(el);park.observe(el)}};
/* the browser knows what loops: ask it, and watch each looping element */
const scan=root=>{
  let all;try{all=root===document?document.getAnimations():root.getAnimations({subtree:true})}catch(e){return}
  for(const a of all){const t=a.effect&&a.effect.target;
    if(t&&a.effect.getComputedTiming().iterations===Infinity)watch(t)}
};
blocks.forEach(watch);
/* the first time a block gets near, look inside it once its entrance effects have started */
const first=new IntersectionObserver((es,ob)=>{for(const e of es)if(e.isIntersecting){ob.unobserve(e.target);setTimeout(()=>scan(e.target),700)}},{rootMargin:'400px 0px'});
blocks.forEach(b=>first.observe(b));
addEventListener('load',()=>setTimeout(()=>scan(document),1200));
})();
</script>
