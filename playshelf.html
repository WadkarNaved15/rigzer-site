<style>
:root{--bg:#000;--line:rgba(255,255,255,.08);--teal:#3fb89a;--blue:#3b82f6;--muted:#8b8f98;
  --pline:#232327;--text:#ecebe6;--text-soft:#c9c8c2;--signal:#e8f23a;
  --display:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{min-height:100vh;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg)}
body.locked{overflow:hidden}

/* ================= Playshelf chrome: nav, three-dot menu, profile card ================= */
.nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:10px;
  height:44px;padding:env(safe-area-inset-top,0) 24px 0;box-sizing:content-box;background:#000;border-top:2px solid #2a2a2a;border-bottom:1px solid var(--line)}
.logo{flex:none;display:block;width:28px;height:28px;border-radius:6px;overflow:hidden;background:#000}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.search{flex:0 1 334px;min-width:0;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:9px;background:#171716;color:#9a9da6;font-size:.8rem}
.search svg{flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit}
.search input::placeholder{color:#a9acb4}
.search:has(:focus-visible){color:#fff;box-shadow:0 0 0 1px rgba(63,184,154,.55)}
.search input::-webkit-search-cancel-button{filter:invert(1)}
.more{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:32px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:none;color:#fff;cursor:pointer}
.more:hover,.more[aria-expanded="true"]{background:rgba(255,255,255,.1)}
.more:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.more svg{display:block;width:26px;height:10px;fill:currentColor}
.menu{position:absolute;left:24px;top:calc(100% + 6px);z-index:30;min-width:220px;padding:6px;border-radius:14px;
  background:rgba(24,24,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.55)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:9px 12px;border:0;border-radius:9px;background:none;color:#e6e7ea;font:inherit;font-size:.88rem;text-align:left;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:rgba(255,255,255,.08);outline:0}
.menu .chk{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(255,255,255,.4);flex:none}
.menu button[aria-checked="true"] .chk{background:var(--teal);border-color:var(--teal)}
.shuf{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);color:#c9ccd3;font:inherit;font-size:.8rem;border-radius:999px;padding:3px 12px;cursor:pointer}
.shuf:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.shuf:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.wrap{display:flex;align-items:flex-start;gap:28px;padding:21px 32px 0 24px}
.lib{flex:1;min-width:0;display:flex;flex-direction:column;margin-bottom:32px}

.profile{flex:none;position:sticky;top:65px;width:183px;height:175px;border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid var(--line);backdrop-filter:blur(6px)}
.banner{position:absolute;inset:0 0 auto 0;height:74px;
  background:linear-gradient(160deg,#f2a516 0%,#e07b12 45%,#8a6bd1 100%);
  -webkit-mask:linear-gradient(#000 55%,transparent);mask:linear-gradient(#000 55%,transparent)}
.avatar{position:absolute;left:14px;top:45px;width:54px;height:54px;border-radius:50%;background:#d4d4d8;overflow:hidden}
.pname{position:absolute;left:14px;top:113px;font-weight:700;font-size:.86rem}
.phandle{position:absolute;left:14px;top:133px;font-size:.65rem;color:var(--muted)}
.toggle{position:absolute;right:10px;top:108px;width:24px;height:48px;border-radius:12px;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,#0e0e0f 0%,#19191b 100%);
  box-shadow:0 0 0 1.5px #050505,0 0 0 2.5px rgba(255,255,255,.07),inset 0 4px 7px rgba(0,0,0,.85),inset 0 -1px 1px rgba(255,255,255,.07);
  transition:box-shadow .45s}
.toggle::before{content:"";position:absolute;inset:0;border-radius:12px;opacity:0;transition:opacity .45s ease;
  background:linear-gradient(180deg,#d63a05 0%,#ff4a0a 45%,#ff5a14 100%);
  box-shadow:inset 0 4px 7px rgba(90,15,0,.7),inset 0 -2px 6px rgba(255,140,60,.45)}
.toggle[aria-pressed="true"]{box-shadow:0 0 0 1.5px #050505,0 0 0 2.5px rgba(255,255,255,.07),0 0 14px rgba(255,74,10,.38),inset 0 4px 7px rgba(0,0,0,.85)}
.toggle[aria-pressed="true"]::before{opacity:1}
.toggle i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:block;
  background:
    linear-gradient(180deg,rgba(255,255,255,.1) 0%,transparent 38%,rgba(0,0,0,.5) 100%),
    repeating-conic-gradient(#232326 0% 25%,#323236 0% 50%) 0 0/3px 3px,
    #1b1b1d;
  box-shadow:0 3px 6px rgba(0,0,0,.7),0 0 0 1px #050505;
  transition:transform .55s cubic-bezier(.34,1.45,.5,1)}
.toggle[aria-pressed="true"] i{transform:translateY(24px)}
.toggle:active i{scale:.93}
/* chrome rim with drifting iridescent highlights */
.toggle i::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;
  background:conic-gradient(#f6f6fa 0%,#8a8a94 10%,#cfdcff 19%,#fff 28%,#ffdca8 37%,#4a4a52 50%,#e9e9f2 60%,#9ba2cc 72%,#fff 82%,#ffd2ea 91%,#f6f6fa 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:ringspin 7s linear infinite}
.toggle:hover i::before,.toggle:focus-visible i::before{animation-duration:2.6s}
@keyframes ringspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.toggle i::before{animation:none}}
.toggle:focus-visible{outline:2px solid var(--teal);outline-offset:4px}

/* ================= floppy-library-v2: floppy.css (verbatim) ================= */
/* =========================================================
   floppy.css — the 3.5" floppy disk component (v2 label size)
   Scales to any width: every inner size is in cqw.
   Per-disk colours come from custom properties set inline:
     --body   disk plastic colour
     --ink    text colour printed on the plastic
     --accent label swatch colour
     --pos    poster crop (object-position)
   ========================================================= */

.floppy {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.02;
  container-type: inline-size;
  filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .5));
}

.floppy__body {
  position: absolute;
  inset: 0;
  background: var(--body, #1b1d21);
  clip-path: polygon(0 0, 92% 0, 100% 7%, 100% 100%, 0 100%); /* cut top-right corner */
  border-radius: 2cqw;
}

/* metal shutter */
.floppy__shutter {
  position: absolute;
  top: 0;
  left: 24%;
  width: 52%;
  height: 33%;
  background: linear-gradient(180deg, #dfe1e4, #9ea3aa);
  border-radius: 0 0 1.2cqw 1.2cqw;
}
.floppy__slot {
  position: absolute;
  top: 13%;
  left: 62%;
  width: 19%;
  height: 66%;
  background: var(--body, #1b1d21);
  border-radius: .6cqw;
  box-shadow: inset 0 1cqw 1.6cqw rgba(0, 0, 0, .5);
}
.floppy__path,
.floppy__diskno {
  position: absolute;
  left: 8%;
  font-family: "JetBrains Mono", monospace;
  color: #24272b;
}
.floppy__path { top: 14%; font-weight: 700; font-size: 2.8cqw; line-height: 1.35; }
.floppy__diskno { bottom: 12%; font-size: 2.5cqw; }

/* insert arrow + vertical code on the plastic */
.floppy__arrow { position: absolute; left: 5%; top: 6%; width: 4.5cqw; }
.floppy__arrow path { fill: none; stroke: var(--ink, #fff); stroke-width: 1; }
.floppy__code {
  position: absolute;
  right: 1.2%;
  top: 8%;
  writing-mode: vertical-rl;
  font-family: "Archivo", sans-serif;
  font-weight: 900;
  font-stretch: 125%;
  font-size: 4.4cqw;
  color: var(--ink, #fff);
  opacity: .85;
}

/* label sticker — v2: ~10% larger poster than v1 */
.floppy__label {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 36%;
  bottom: 6%;
  background: #f1efe8;
  border-radius: 1.4cqw;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.floppy__art {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  object-fit: cover;
  object-position: var(--pos, 50% 50%);
}
.floppy__strip { padding: 2.8cqw 3.6cqw; display: flex; flex-direction: column; gap: 1.4cqw; }
.floppy__title {
  font-family: "Archivo", sans-serif;
  font-weight: 900;
  font-stretch: 112%;
  font-size: 7.4cqw;
  line-height: .95;
  text-transform: uppercase;
  color: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.floppy__meta {
  display: flex;
  align-items: center;
  gap: 1.6cqw;
  font-family: "JetBrains Mono", monospace;
  font-size: 2.9cqw;
  color: #4a4a48;
}
.floppy__swatch { width: 3.2cqw; height: 2.6cqw; background: var(--accent, #e8f23a); }

/* write-protect / density holes */
.floppy__hole {
  position: absolute;
  bottom: 1.8%;
  width: 3cqw;
  height: 3cqw;
  background: rgba(0, 0, 0, .55);
}
.floppy__hole--l { left: 1.6%; }
.floppy__hole--r { right: 1.6%; }

/* hero variant: bigger shadow, slight tilt, smaller edge code */
.floppy--hero { transform: rotate(-4deg); filter: drop-shadow(0 30px 40px rgba(0, 0, 0, .55)); }
.floppy--hero .floppy__code { font-size: 4.2cqw; }
.floppy--hero .floppy__path { font-size: 2.6cqw; }
.floppy--hero .floppy__title { font-size: 7cqw; }

/* pulled-from-case variant on the detail page */
.floppy--out { transform: rotate(9deg); filter: drop-shadow(0 24px 30px rgba(0, 0, 0, .6)); }

/* "Insert disk" empty slot */
.floppy--empty {
  border: 2px dashed #3a3a40;
  clip-path: polygon(0 0, 92% 0, 100% 7%, 100% 100%, 0 100%);
  border-radius: 6px;
  box-sizing: border-box;
  display: grid;
  place-items: center;
  filter: none;
  color: #8e8e8a;
}

/* ---------- Disk-box spines ---------- */
.spine {
  width: 64px;
  height: 300px;
  background: var(--body);
  border-radius: 4px 4px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: inset -6px 0 0 rgba(0, 0, 0, .18);
  transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.spine img { width: 100%; height: 80px; object-fit: cover; object-position: var(--pos); }
.spine__accent { height: 6px; background: var(--accent); }
.spine__title {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 14px 0;
}
.spine__title span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-weight: 900;
  font-stretch: 125%;
  font-size: 19px;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--ink);
}
.spine-slot { width: 64px; height: 260px; border: 1px dashed #34343a; border-bottom: none; border-radius: 4px 4px 0 0; box-sizing: border-box; }
.pick:hover .spine { transform: translateY(-18px); }
.pick[aria-pressed="true"] .spine { transform: translateY(-28px); }


/* ================= floppy-library-v2: exe.css (verbatim) ================= */
/* =========================================================
   exe.css — the ".exe" design language, kept separate
   Windows-style file windows, properties sheets, tabs,
   Run / Eject buttons and the DOS status bar.
   Depends only on the tokens below (override them freely).
   ========================================================= */

:root {
  --exe-bg: #121214;
  --exe-bg-glass: rgba(18, 18, 20, 0.92);
  --exe-titlebar: #1c1c20;
  --exe-line: #34343a;
  --exe-text: #ecebe6;
  --exe-text-soft: #c9c8c2;
  --exe-label: #8e8e8a;
  --exe-chrome: #6a6a70;
  --exe-run: #e8f23a;         /* primary action / drive LED */
  --exe-run-ink: #0b0b0c;
  --exe-mono: "JetBrains Mono", ui-monospace, monospace;
  --exe-display: "Archivo", system-ui, sans-serif;
}

/* ---------- Window ---------- */
.exe-window {
  border: 1px solid var(--exe-line);
  background: var(--exe-bg-glass);
  color: var(--exe-text);
  max-width: 620px;
}

.exe-titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  background: var(--exe-titlebar);
  border-bottom: 1px solid var(--exe-line);
  font: 400 12px/1.2 var(--exe-mono);
  color: var(--exe-text-soft);
}

/* the three decorative window controls: min / max / close */
.exe-controls { display: flex; gap: 6px; }
.exe-controls span { width: 10px; height: 10px; border: 1px solid var(--exe-chrome); }
.exe-controls span:last-child { background: var(--exe-chrome); }

/* ---------- Properties sheet ---------- */
.exe-props {
  margin: 0;
  padding: 16px 16px 4px;
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 10px 16px;
  font: 400 13px/1.4 var(--exe-mono);
}
.exe-props dt { color: var(--exe-label); }
.exe-props dd { margin: 0; overflow-wrap: anywhere; }
.exe-props--roomy { padding: 20px; font-size: 14px; }

/* ---------- Tabs (README.TXT / Contents / Properties) ---------- */
.exe-tabs {
  display: flex;
  border-bottom: 1px solid var(--exe-line);
  font: 400 13px/1 var(--exe-mono);
  text-transform: uppercase;
}
.exe-tab {
  all: unset;
  cursor: pointer;
  height: 40px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  color: #9a9a96;
  border-right: 1px solid var(--exe-line);
}
.exe-tab[aria-selected="true"] { color: var(--exe-run-ink); background: var(--tab-accent, #33d6ff); }
.exe-tab:focus-visible { outline: 2px solid var(--tab-accent, #33d6ff); outline-offset: -2px; }

.exe-panel { padding: 20px; font: 400 14px/1.7 var(--exe-mono); color: var(--exe-text-soft); }
.exe-panel p { margin: 0 0 12px; }
.exe-panel p:last-child { margin: 0; }

.exe-files { list-style: none; margin: 0; padding: 12px 0; font: 400 14px/1.4 var(--exe-mono); }
.exe-files li { display: flex; justify-content: space-between; padding: 8px 20px; }
.exe-files li span:last-child { color: var(--exe-label); }

/* ---------- Actions ---------- */
.exe-actions { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; }
.exe-actions--bare { padding: 0; }

.exe-btn {
  all: unset;
  box-sizing: border-box;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 22px;
  font: 800 15px/1 var(--exe-display);
  font-stretch: 125%;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--exe-text);
}
.exe-btn:focus-visible { outline: 2px solid var(--exe-run); outline-offset: 3px; }
.exe-btn--run { background: var(--exe-run); color: var(--exe-run-ink); font-weight: 900; font-size: 16px; padding: 0 24px; }
.exe-btn--outline { border: 1px solid var(--exe-text); }
.exe-btn--outline:hover { color: var(--exe-run); border-color: var(--exe-run); }
.exe-btn--ghost { color: #9a9a96; font: 400 13px/1 var(--exe-mono); letter-spacing: .06em; padding: 0 18px; }
.exe-btn--ghost:hover { color: var(--exe-text); }
.exe-btn--icon { width: 48px; padding: 0; justify-content: center; border: 1px solid var(--exe-line); }
.exe-btn--lg { height: 52px; }

/* ---------- Status kicker ("Drive A: · Disk 02 inserted") ---------- */
.exe-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 400 13px/1 var(--exe-mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--kicker, var(--exe-run));
}
.exe-kicker::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

/* ---------- DOS prompt / status bar ---------- */
.dos-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px 24px;
  padding: 14px clamp(16px, 4vw, 56px);
  border-top: 1px solid #232327;
  background: #0e0e10;
  font: 400 13px/1.4 var(--exe-mono);
  color: var(--exe-label);
}
.dos-cursor { color: var(--exe-run); animation: dos-blink 1s steps(1) infinite; }
@keyframes dos-blink { 50% { opacity: 0; } }

/* ---------- DOS-style search field ---------- */
.dos-search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--exe-line);
  background: var(--exe-bg);
  font: 400 13px/1 var(--exe-mono);
  color: #9a9a96;
}
.dos-search input { all: unset; width: 180px; color: var(--exe-text); }

@media (prefers-reduced-motion: reduce) {
  .dos-cursor { animation: none; }
}


/* ================= floppy-library-v2: base.css sections (hero, disk grid, disk box, detail) ================= */
/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--pline); }
.hero__backdrop {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; filter: blur(48px) saturate(1.3); opacity: .38; transform: scale(1.25);
}
.hero__scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,11,12,.35) 0%, rgba(11,11,12,.92) 60%); }
.hero__inner {
  position: relative;
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 48px 64px;
  padding: clamp(32px, 5vw, 72px) var(--gutter);
}
.hero__disk { flex: 0 1 420px; min-width: 260px; }
.hero__info { flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
.hero__title {
  margin: 0; font-weight: 900; font-stretch: 125%;
  font-size: clamp(44px, 6.4vw, 96px); line-height: .9; letter-spacing: -.02em; text-transform: uppercase;
}
.hero__blurb { margin: 0; max-width: 560px; font-size: 18px; line-height: 1.5; color: var(--text-soft); }

/* ---------- Sections ---------- */
.section { padding: 48px var(--gutter) 24px; display: flex; flex-direction: column; gap: 28px; }
.section--box { padding-bottom: 56px; }
.section__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  border-bottom: 1px solid var(--pline); padding-bottom: 14px;
}
.section__title { margin: 0; font-weight: 900; font-stretch: 125%; font-size: 28px; text-transform: uppercase; }
.section__meta { font: 400 13px/1 var(--mono); color: var(--muted); }

/* clickable disk tiles */
.pick { all: unset; cursor: default; display: block; box-sizing: border-box; }
.pick:focus-visible { outline: 2px solid var(--signal); outline-offset: 6px; border-radius: 8px; }
.pick .lift { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.pick:hover .lift { transform: translateY(-8px) rotate(-1.5deg); }

.disk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 40px 32px; }
.disk-caption {
  margin-top: 16px; display: flex; justify-content: space-between; gap: 8px;
  font: 400 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft);
}
.disk-caption__state { color: var(--muted); }
.pick[aria-pressed="true"] .disk-caption__state { color: var(--signal); }

/* disk box */
.diskbox { position: relative; background: #141416; border: 1px solid #2a2a2e; padding: 40px 32px 0; overflow-x: auto; }
.diskbox__row { display: flex; align-items: flex-end; gap: 12px; min-width: max-content; padding-bottom: 96px; }
.diskbox__front {
  position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
  background: #1d1d21; border-top: 1px solid #3a3a40;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 32px;
}
.diskbox__name { font-weight: 900; font-stretch: 125%; font-size: clamp(22px, 3vw, 40px); text-transform: uppercase; }

/* ---------- Detail page ---------- */
.detail { position: relative; overflow: hidden; flex: 1; }
.detail__inner { position: relative; display: flex; flex-wrap: wrap; gap: 56px 72px; align-items: flex-start; padding: clamp(32px, 5vw, 72px) var(--gutter); }
.detail__visual { flex: 1 1 520px; min-width: 0; max-width: 640px; }
.detail__info { flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
.detail__title { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(56px, 8vw, 120px); line-height: .88; letter-spacing: -.02em; text-transform: uppercase; }

.stage { position: relative; width: 100%; aspect-ratio: 1.12 / 1; }
.stage__disk { position: absolute; right: 0; top: 0; width: 56%; }
.stage__case { position: absolute; left: 0; bottom: 0; width: 70%; aspect-ratio: 1 / 1.08; display: flex; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
.case__hinge { width: 7%; background: repeating-linear-gradient(180deg, #2a2c31 0 6px, #1e2024 6px 9px); border-radius: 6px 0 0 6px; }
.case__front { position: relative; flex: 1; border: 10px solid rgba(220,230,240,.10); border-left: none; border-radius: 0 6px 6px 0; overflow: hidden; background: #0f1114; }
.case__front > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos); }
.case__top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px; display: flex; justify-content: space-between; font: 400 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; background: rgba(11,11,12,.7); }
.case__bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 18px 20px; background: var(--bg); border-top: 4px solid var(--accent); }
.case__title { font-weight: 900; font-stretch: 125%; font-size: clamp(32px, 4.4vw, 56px); line-height: .9; text-transform: uppercase; }
.case__sub { margin-top: 8px; font: 400 11px/1 var(--mono); color: #9a9a96; text-transform: uppercase; letter-spacing: .06em; }
.case__glare { position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 32%); pointer-events: none; }

.chips { display: flex; gap: 12px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border: 1px solid #2a2a2e; background: #141416; text-decoration: none; font-weight: 800; font-stretch: 125%; font-size: 14px; text-transform: uppercase; }
.chip__swatch { width: 36px; height: 36px; border-radius: 3px; background: var(--body); }
.label-mono { font: 400 12px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
/* =========================================================
   tape-case.css — the clear plastic tape case (spine view)
   Layers, back to front:
     .tape__shell     clear body: top highlight, dark bottom edge, drop shadow
     .tape__lip       label colour refracting through the clear lips
     .tape__window    the label itself (see tape-labels.css)
     .tape__glass     plastic over the label: edge lines + glare streak
     .tape__cap       thick clear end caps, ridges, hinge notch
     .tape__wear      faint scratches
   Per-tape variation comes from custom properties set inline:
     --edge  colour seen through the lips   --wear  scratch strength (0–1)
     --s1…--s4  glare streak stops (%)      --jl / --jr  stack misalignment (px)
   ========================================================= */

:root {
  --plastic: 225, 232, 240;   /* rgb of the clear plastic tint */
  --tape-h: 82px;
  --cap-w: 28px;
  --lip: 9px;                /* clear band above/below the label */
}

.tape-stack { display: flex; flex-direction: column; gap: 3px; padding: 0 64px 0 12px; }

.tape {
  position: relative;
  height: var(--tape-h);
  margin-left: calc(var(--jl, 0) * 1px);
  margin-right: calc(var(--jr, 0) * 1px);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.tape-pick { all: unset; cursor: pointer; display: block; width: 100%; box-sizing: border-box; }
.tape-pick:focus-visible { outline: 2px solid #e8f23a; outline-offset: 4px; border-radius: 6px; }
.tape-pick:hover .tape { transform: translateX(18px); }
.tape-pick[aria-pressed="true"] .tape { transform: translateX(56px); }

/* clear body */
.tape__shell {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  border-radius: 4px;
  border: 1px solid rgba(var(--plastic), .34);
  background: linear-gradient(180deg,
    rgba(var(--plastic), .30) 0%,
    rgba(var(--plastic), .08) 8%,
    rgba(var(--plastic), .035) 45%,
    rgba(var(--plastic), .06) 86%,
    rgba(var(--plastic), .22) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .70),     /* top specular */
    inset 0 -1px 0 rgba(255, 255, 255, .25),
    inset 0 -10px 12px -6px rgba(0, 0, 0, .55), /* thickness at the bottom */
    0 2px 0 -1px rgba(0, 0, 0, .85),            /* hard contact shadow */
    0 12px 18px -4px rgba(0, 0, 0, .70);
}

/* label colour refracting through the clear lips */
.tape__lip {
  position: absolute;
  left: var(--cap-w);
  right: var(--cap-w);
  height: 8px;
  border-radius: 2px;
  background: var(--edge, #888);
}
.tape__lip--top    { top: 3px;    opacity: .34; filter: blur(1.6px); }
.tape__lip--bottom { bottom: 3px; opacity: .22; filter: blur(2px); }
.tape__lip--top::after,
.tape__lip--bottom::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; filter: none; }

/* thin bright line where the label edge sits behind the plastic */
.tape__seam { position: absolute; left: var(--cap-w); right: var(--cap-w); height: 1px; }
.tape__seam--top    { top: calc(var(--lip) - 1px); background: rgba(255, 255, 255, .45); }
.tape__seam--bottom { bottom: calc(var(--lip) - 1px); background: rgba(255, 255, 255, .22); }

/* label window */
.tape__window {
  position: absolute;
  left: var(--cap-w);
  right: var(--cap-w);
  top: var(--lip);
  bottom: var(--lip);
  overflow: hidden;
  display: flex;
}

/* plastic over the label */
.tape__glass {
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .35),
    inset 0 -1px 0 rgba(0, 0, 0, .35),
    inset 0 0 0 1px rgba(0, 0, 0, .25);
  background:
    linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 20%, rgba(255,255,255,0) 74%, rgba(255,255,255,.07) 100%),
    linear-gradient(102deg,
      rgba(255,255,255,0) var(--s1, 30%),
      rgba(255,255,255,.14) var(--s2, 35%),
      rgba(255,255,255,.04) var(--s3, 40%),
      rgba(255,255,255,0) var(--s4, 46%));
}

/* end caps */
.tape__cap {
  position: absolute;
  top: 1px;
  bottom: 1px;
  width: calc(var(--cap-w) - 1px);
}
.tape__cap--left {
  left: 1px;
  border-radius: 3px 0 0 3px;
  background: linear-gradient(90deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.03) 55%, rgba(255,255,255,.10) 100%);
  box-shadow: inset -1px 0 0 rgba(255,255,255,.22), inset 1px 0 0 rgba(255,255,255,.28);
}
.tape__cap--right {
  right: 1px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(270deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.03) 55%, rgba(255,255,255,.10) 100%);
  box-shadow: inset 1px 0 0 rgba(255,255,255,.22), inset -1px 0 0 rgba(255,255,255,.30);
}
.tape__ridge     { position: absolute; left: 9px;  top: 13px; bottom: 13px; width: 2px; border-radius: 1px; background: rgba(255,255,255,.20); }
.tape__ridge--in { left: 15px; top: 20px; bottom: 20px; width: 1px; background: rgba(0,0,0,.35); }
.tape__notch {
  position: absolute; right: 7px; top: 20px; bottom: 20px; width: 10px; border-radius: 4px;
  background: rgba(0,0,0,.5);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.25), inset -1px -1px 0 rgba(255,255,255,.08);
}

/* wear */
.tape__wear {
  position: absolute;
  inset: 0;
  border-radius: 4px;
  pointer-events: none;
  opacity: var(--wear, .7);
  background:
    repeating-linear-gradient(113deg, rgba(255,255,255,.035) 0 1px, rgba(255,255,255,0) 1px 17px),
    repeating-linear-gradient(71deg,  rgba(255,255,255,.025) 0 1px, rgba(255,255,255,0) 1px 29px);
}

/* "loaded" pointer */
.tape__pointer {
  display: none;
  position: absolute; left: -28px; top: 50%; transform: translateY(-50%);
  width: 0; height: 0;
  border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 12px solid #e8f23a;
}
.tape-pick[aria-pressed="true"] .tape__pointer { display: block; }

@media (prefers-reduced-motion: reduce) { .tape { transition: none; } }
@media (max-width: 640px) { .tape-stack { padding: 0 24px 0 4px; } .tape-pick[aria-pressed="true"] .tape { transform: translateX(20px); } }
/* =========================================================
   tape-labels.css — the four spine label styles
   Each sits inside .tape__window. Colours via custom properties:
     --body  label colour   --ink  text on --body
     --accent tag/band colour   --band  poster crop (object-position)
   ========================================================= */

.lbl { display: flex; width: 100%; height: 100%; }
.lbl img { display: block; object-fit: cover; object-position: var(--band, 50% 40%); }
.mono { font-family: "JetBrains Mono", monospace; }
.vert { writing-mode: vertical-rl; }
.vert--up { writing-mode: vertical-rl; transform: rotate(180deg); }

/* A — block: number tab, big stretched title, poster strip */
.lbl--block { background: var(--body); }
.lbl--block .lbl__num { flex: 0 0 56px; background: #000; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #ecebe6; }
.lbl--block .lbl__title { flex: 0 0 auto; display: flex; align-items: center; padding: 0 24px; font-weight: 900; font-stretch: 125%; font-size: 30px; text-transform: uppercase; white-space: nowrap; color: var(--ink); }
.lbl--block img { flex: 1 1 0; min-width: 0; height: 100%; }
.lbl--block .lbl__code { flex: 0 0 52px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; color: var(--ink); }

/* B — full-bleed poster with a black title tag */
.lbl--tag { position: relative; }
.lbl--tag img { position: absolute; inset: 0; width: 100%; height: 100%; }
.lbl--tag .lbl__title {
  position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  background: #000; padding: 8px 18px;
  font-weight: 900; font-stretch: 125%; font-size: 28px; text-transform: uppercase; white-space: nowrap;
  color: var(--accent);
}
.lbl--tag .lbl__code {
  position: absolute; right: 0; top: 0; bottom: 0; width: 56px;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 10px; color: #000;
}

/* C — white paper label, typewriter text, tilted poster sticker */
.lbl--paper { align-items: center; gap: 24px; padding: 0 20px 0 28px; box-sizing: border-box; background: #f1efe8; }
.lbl--paper .lbl__text { flex: 1 1 auto; min-width: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #111; }
.lbl--paper .lbl__title { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl--paper .lbl__sub { margin-top: 4px; font-size: 16px; }
.lbl--paper img { flex: 0 0 160px; width: 160px; height: 54px; border: 3px solid #fff; transform: rotate(-3deg); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.lbl--paper .lbl__code { flex: 0 0 auto; font-size: 10px; color: #4a4a48; }

/* D — numbered black tab, plain small text, poster on the right third */
.lbl--stripe .lbl__num { flex: 0 0 64px; background: #000; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #ecebe6; }
.lbl--stripe .lbl__body { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; background: var(--body); color: var(--ink); }
.lbl--stripe .lbl__lines { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lbl--stripe .lbl__title { font-weight: 800; font-size: 18px; white-space: nowrap; }
.lbl--stripe .lbl__dev { font-size: 15px; }
.lbl--stripe .lbl__code { font-weight: 800; font-size: 18px; }
.lbl--stripe img { flex: 0 0 30%; width: 30%; height: 100%; }

@media (max-width: 640px) {
  .lbl--block .lbl__title, .lbl--tag .lbl__title { font-size: 20px; padding-inline: 12px; }
  .lbl--paper img, .lbl--stripe img { display: none; }
}
/* =========================================================
   front-case.css — the loaded tape, seen from the front
   Clear case with a hinge strip, cover insert, glare and wear.
   Set --body (insert backing) and --cover (poster crop) inline.
   ========================================================= */

.front-case { position: relative; aspect-ratio: 1.58; filter: drop-shadow(0 24px 34px rgba(0, 0, 0, .7)); }

.front-case__shell {
  position: absolute; inset: 0; box-sizing: border-box; border-radius: 6px;
  border: 1px solid rgba(225, 232, 240, .34);
  background: linear-gradient(180deg, rgba(225,232,240,.24) 0%, rgba(225,232,240,.06) 7%, rgba(225,232,240,.03) 50%, rgba(225,232,240,.06) 92%, rgba(225,232,240,.18) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(255,255,255,.22);
}

.front-case__hinge {
  position: absolute; left: 1px; top: 1px; bottom: 1px; width: 24px; border-radius: 5px 0 0 5px;
  background: linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
  box-shadow: inset -1px 0 0 rgba(255,255,255,.25);
}
.front-case__knuckle {
  position: absolute; left: 6px; width: 12px; height: 14%; border-radius: 3px;
  background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
}
.front-case__knuckle--top { top: 10%; }
.front-case__knuckle--bottom { bottom: 10%; }

.front-case__insert { position: absolute; left: 32px; right: 12px; top: 12px; bottom: 12px; overflow: hidden; background: var(--body, #111); }
.front-case__insert img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--cover, 50% 50%); }
.front-case__glass {
  position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(0,0,0,.3);
  background:
    linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.16) 38%, rgba(255,255,255,.04) 46%, rgba(255,255,255,0) 54%),
    linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 18%);
}
.front-case__wear {
  position: absolute; inset: 0; border-radius: 6px; pointer-events: none; opacity: .8;
  background: repeating-linear-gradient(113deg, rgba(255,255,255,.03) 0 1px, rgba(255,255,255,0) 1px 19px);
}

/* ================= Open case section ================= */
.ocs .oc__track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:22px 0 8px}
.ocs .oc__track::-webkit-scrollbar{display:none}
.oc__slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0}
.oc__nav{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border:1px solid #34343a;background:#121214;color:var(--text);font:400 16px/1 var(--mono)}
.oc__nav:hover{border-color:var(--signal);color:var(--signal)}
.oc__nav:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.oc__dots{display:flex;gap:8px;justify-content:center;padding-top:6px}
.oc__dot{all:unset;cursor:pointer;width:22px;height:4px;background:#2a2a2f;transition:background .2s,width .25s}
.oc__dot[aria-current="true"]{background:var(--signal);width:34px}
.oc__dot:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.oc__cap{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:center;justify-content:center;font:400 12px/1.2 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.oc__cap b{color:var(--text);font-weight:700}
.oc__open{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:34px;padding:0 16px;background:var(--signal);color:#000;font:700 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.oc__open:hover{filter:brightness(1.08)}
.oc__open:focus-visible{outline:2px solid #fff;outline-offset:3px}

.ocase{--trayc:color-mix(in srgb,var(--body) 52%,#d3d9df);container-type:inline-size;position:relative;width:min(100%,940px);aspect-ratio:2.1/1;font-family:var(--display);color:var(--ink);
  filter:drop-shadow(0 30px 28px rgba(0,0,0,.7)) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
/* artwork sits UNDER the plastic; coordinates mirror the 2100x1000 SVG */
.oc-lid,.oc-card,.oc-spine,.oc-disc{position:absolute}
.oc-lid{left:3.05%;top:6.4%;width:39.4%;height:87.2%;background:var(--body);overflow:hidden;
  box-shadow:inset 0 0 6cqw rgba(0,0,0,.18)}
.oc-card{left:52.95%;top:6.4%;width:44.1%;height:87.2%;background:var(--trayc);
  background-image:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.2),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.14))}
.oc-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* back inlay content (left) */
.oc-frame{position:absolute;left:12%;right:12%;top:24%;bottom:24%;border:max(1px,.16cqw) solid var(--ink);display:grid;grid-template-rows:1.15fr 1fr;color:var(--ink)}
.oc-frame__top{padding:1.5cqw 1.6cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:1cqw;border-bottom:max(1px,.16cqw) solid var(--ink)}
.oc-tag{display:inline-block;background:#000;color:#fff;padding:.5cqw 1cqw;font-weight:900;font-stretch:112%;text-transform:uppercase;line-height:1.08;font-size:max(9px,2.5cqw);max-width:100%}
.oc-logo{flex:none;width:3cqw;height:3cqw;border-radius:50%;background:#000;display:grid;place-items:center}
.oc-logo svg{width:60%;height:60%;stroke:#fff;fill:none;stroke-width:1.8}
.oc-frame__bot{display:grid;grid-template-columns:1.25fr 1fr}
.oc-info{padding:1.2cqw 1.5cqw;font:700 max(6px,1.02cqw)/1.35 var(--display);text-transform:uppercase;letter-spacing:.02em;display:flex;flex-direction:column;justify-content:center;gap:.15cqw}
.oc-info span{opacity:.75;font-weight:500}
.oc-side{border-left:max(1px,.16cqw) solid var(--ink);display:grid;grid-template-rows:1fr 1fr}
.oc-glyphs{display:flex;gap:.5cqw;align-items:center;justify-content:center;border-bottom:max(1px,.16cqw) solid var(--ink)}
.oc-glyphs i{width:2cqw;height:2cqw;background:#000;display:grid;place-items:center}
.oc-glyphs svg{width:70%;height:70%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.oc-bars{margin:.9cqw 1.1cqw;background:repeating-linear-gradient(90deg,var(--ink) 0 .22cqw,transparent .22cqw .42cqw,var(--ink) .42cqw .5cqw,transparent .5cqw .85cqw,var(--ink) .85cqw 1.2cqw,transparent 1.2cqw 1.4cqw)}

/* spine strip inside the tray */
.oc-spine{left:52.95%;top:6.4%;width:4%;height:87.2%;background:linear-gradient(90deg,#050506,#151517 50%,#050506);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.oc-spine span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:max(8px,1.85cqw);letter-spacing:.04em;white-space:nowrap}

/* the CD */
.oc-disc{left:58.43%;top:11%;width:37.14%;aspect-ratio:1;border-radius:50%;cursor:default;
  filter:drop-shadow(0 .8cqw 1.1cqw rgba(0,0,0,.45)) drop-shadow(0 .1cqw .2cqw rgba(0,0,0,.4));transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.oc-disc:hover{transform:rotate(-10deg)}
.oc-disc__print{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  -webkit-mask:radial-gradient(circle,transparent 0 6.1%,#000 6.5% 13.4%,transparent 13.6% 13.9%,#000 14.1% 98.9%,transparent 99.3%);
  mask:radial-gradient(circle,transparent 0 6.1%,#000 6.5% 13.4%,transparent 13.6% 13.9%,#000 14.1% 98.9%,transparent 99.3%)}
.oc-disc__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);transform:scale(1.04)}
.oc-disc__tint{position:absolute;inset:0;background:radial-gradient(circle,transparent 24%,rgba(0,0,0,.3) 100%)}
/* two opposing anisotropic highlights + faint spectrum, like a real CD surface */
.oc-disc__sheen{position:absolute;inset:-2%;border-radius:50%;mix-blend-mode:screen;opacity:.8;
  background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.55) 14deg,rgba(150,190,255,.28) 24deg,rgba(255,200,160,.25) 34deg,rgba(255,255,255,0) 52deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.5) 194deg,rgba(255,170,220,.25) 206deg,rgba(160,255,210,.2) 216deg,rgba(255,255,255,0) 236deg);
  animation:ocsheen 26s linear infinite}
.oc-disc:hover .oc-disc__sheen{animation-duration:6s}
/* clear inner ring (no print) with stacking ring */
.oc-disc__clear{position:absolute;left:50%;top:50%;width:27.7%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,transparent 0 22.5%,rgba(255,255,255,.16) 23% 100%);
  box-shadow:inset 0 0 0 .12cqw rgba(255,255,255,.55),inset 0 0 1.2cqw rgba(255,255,255,.25)}
.oc-disc__clear::before{content:"";position:absolute;inset:22%;border-radius:50%;box-shadow:0 0 0 .12cqw rgba(255,255,255,.7),inset 0 0 0 .12cqw rgba(0,0,0,.18)}
.oc-disc__clear::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,255,255,.35) 34deg,transparent 60deg 180deg,rgba(255,255,255,.3) 214deg,transparent 240deg)}
/* silver edge of the disc */
.oc-disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 .22cqw rgba(238,242,246,.9),inset 0 0 0 .4cqw rgba(0,0,0,.12)}
.oc-star{position:absolute;left:18%;top:14%;width:25%;aspect-ratio:1;clip-path:polygon(50.0% 0.0%,58.2% 13.9%,71.7% 5.0%,73.1% 21.1%,89.1% 18.8%,83.3% 33.9%,98.7% 38.9%,87.0% 50.0%,98.7% 61.1%,83.3% 66.1%,89.1% 81.2%,73.1% 78.9%,71.7% 95.0%,58.2% 86.1%,50.0% 100.0%,41.8% 86.1%,28.3% 95.0%,26.9% 78.9%,10.9% 81.2%,16.7% 66.1%,1.3% 61.1%,13.0% 50.0%,1.3% 38.9%,16.7% 33.9%,10.9% 18.8%,26.9% 21.1%,28.3% 5.0%,41.8% 13.9%);
  background:conic-gradient(from 20deg,#ece8e0,#b3ac9a,#f8f4e8,#968f80,#ece8e0);display:grid;place-items:center}
.oc-disc__txt{position:absolute;right:11%;top:35%;display:flex;flex-direction:column;gap:.1cqw;text-align:right;color:#fff;font:700 max(5px,.8cqw)/1.25 var(--display);text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.oc-disc__tag{position:absolute;right:13%;bottom:16%}
.oc-disc__tag .oc-tag{font-size:max(8px,2.1cqw)}
.oc-move{transform:translateX(calc(var(--gxn,0)*240px));transition:transform .45s cubic-bezier(.2,.7,.2,1)}
@keyframes ocsheen{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.oc-disc__sheen{animation:none}.oc-disc,.oc-move{transition:none}}

.row__tools{display:flex;align-items:center;gap:14px}
.row__nav{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border:1px solid #34343a;background:#121214;color:var(--text);font:400 16px/1 var(--mono)}

.row__track{display:flex;gap:28px;overflow-x:auto;scroll-snap-type:x proximity;padding:18px var(--gutter) 26px;margin:-18px calc(var(--gutter) * -1) 0;scroll-padding-left:var(--gutter);scrollbar-width:none}
.row__track::-webkit-scrollbar{display:none}

/* ---------- integration tweaks ---------- */
.lib img,.detail-ov img{display:block}

.detail-ov button.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;min-height:44px;text-transform:uppercase;letter-spacing:.06em;font:400 13px/1 var(--mono);color:var(--text)}

/* ---- carved category separator ---- */
.sep{flex:0 0 1px;align-self:stretch;background:#2a2a2f;position:relative;margin:-21px -34px 0 34px}

.cats{position:absolute;left:-42px;top:0;width:43px;padding:10px 4px 10px 5px;display:flex;flex-direction:column;gap:2px;
  background:none;box-sizing:border-box;

.cats__cover{position:absolute;right:0;top:-24px;bottom:-24px;width:1px;background:#000;pointer-events:none;transition:opacity .15s}
.cats::before,.cats::after{transition:opacity .15s}

.cats .cat{position:relative;z-index:1}

.cats:hover .cats__cover,.cats:has(:focus-visible) .cats__cover,.cats.is-open .cats__cover,
.cats:hover .cats__fill,.cats:has(:focus-visible) .cats__fill,.cats.is-open .cats__fill{opacity:0}

/* ---- embedded on the Rigzer page: transparent canvas; only the part right of the separator line is a black panel ---- */
:root{--pl:calc(max(0px,(100vw - 1180px)/2) + 48px)}
html{background:#F7F7F9!important}body{background:transparent!important}
html::before{content:"";position:fixed;top:0;bottom:0;right:0;left:var(--pl);z-index:-1;background:#000;border-left:1px solid #2a2a2f;border-radius:26px 0 0 26px}

.detail-ov{left:var(--pl);border-left:1px solid #2a2a2f;border-radius:26px 0 0 26px}
/* black fillets where the tab meets the panel edge (they were invisible against a black page) */
.cats__spT,.cats__spB{position:absolute;right:0;width:26px;height:26px;background:#000;pointer-events:none;transition:opacity .15s}
.cats__spT{bottom:calc(100% - 1px);-webkit-mask:radial-gradient(circle at 0 0,transparent 25px,#000 26px);mask:radial-gradient(circle at 0 0,transparent 25px,#000 26px)}
.cats__spB{top:calc(100% - 1px);-webkit-mask:radial-gradient(circle at 0 100%,transparent 25px,#000 26px);mask:radial-gradient(circle at 0 100%,transparent 25px,#000 26px)}
.cats:hover .cats__spT,.cats:hover .cats__spB,.cats:has(:focus-visible) .cats__spT,.cats:has(:focus-visible) .cats__spB,.cats.is-open .cats__spT,.cats.is-open .cats__spB{opacity:0}
@media (max-width:900px){html::before{left:0;border:0;border-radius:0}.detail-ov{left:0;border:0;border-radius:0}.cats__spT,.cats__spB{display:none}}
/* rz-perf */
.rz-paused *,.rz-paused *::before,.rz-paused *::after{animation-play-state:paused!important}
/* the shimmer sits inside a drop-shadow group, so every frame of it re-blurs the whole case: it only turns while the disc is hovered */
.oc-disc__sheen{animation-play-state:paused}
.ocase.is-vis .oc-disc:hover .oc-disc__sheen{animation-play-state:running}
.tv:not(.is-vis) .tv__img,.tv:not(.is-vis) .tv__static{animation-play-state:paused}
.oc-disc__print{contain:paint}
/* the case's drop-shadow filter re-blurred a 940px surface on every composite; the same shadow as box-shadow is painted once with the tiles */
.ocase{filter:none;isolation:isolate}
.oc-lid{box-shadow:inset 0 0 6cqw rgba(0,0,0,.18),0 30px 28px rgba(0,0,0,.7),0 4px 6px rgba(0,0,0,.5)}
.oc-card{box-shadow:0 30px 28px rgba(0,0,0,.7),0 4px 6px rgba(0,0,0,.5)}
/* rz-height: the host sizes this frame to the full library, so the category rail sits at the middle of it */
html{overflow:hidden!important}
@media (min-width:901px){.site .sep__anchor{position:absolute;top:calc(50% + 10px);margin-top:0}.cats{top:calc(var(--rh,244px)/-2)}.rz-open .site .sep__anchor{top:calc(var(--oh,800px)/2 - 28px)}}
</style>
</head>
<body>
<div class="site">
  <div class="sep" aria-hidden="false"><div class="sep__anchor"><nav class="cats" id="cats" aria-label="Categories"><i class="cats__bg"></i><i class="cats__fill"></i><i class="cats__cover"></i><i class="cats__spT"></i><i class="cats__spB"></i><button class="cat" type="button" data-cat="all" aria-pressed="true" aria-label="All" title="All"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>All</span></button><button class="cat" type="button" data-cat="action" aria-pressed="false" aria-label="Action" title="Action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg><span>Action</span></button><button class="cat" type="button" data-cat="rpg" aria-pressed="false" aria-label="RPG" title="RPG"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.5-3 7.5-7 9.5-4-2-7-5-7-9.5V6z"/></svg><span>RPG</span></button><button class="cat" type="button" data-cat="strategy" aria-pressed="false" aria-label="Strategy" title="Strategy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h8M9 20l1-6h4l1 6M10 14c-1.5-1-2-2.5-2-4a4 4 0 018 0c0 1.5-.5 3-2 4"/></svg><span>Strategy</span></button><button class="cat" type="button" data-cat="racing" aria-pressed="false" aria-label="Racing" title="Racing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h13l-3 4 3 4H5"/></svg><span>Racing</span></button><button class="cat cat--more" type="button" data-cat="indie" aria-pressed="false" aria-label="Indie" title="Indie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 15.8 6.8 19l1.4-5.9-4.6-4 6-.5z"/></svg><span>Indie</span></button><button class="cat cat--more" type="button" data-cat="sports" aria-pressed="false" aria-label="Sports" title="Sports"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6c3 3 3 9 0 12M18 6c-3 3-3 9 0 12"/></svg><span>Sports</span></button><button class="cat cat--more" type="button" data-cat="adventure" aria-pressed="false" aria-label="Adventure" title="Adventure"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Adventure</span></button></nav></div></div>
  <main class="lib" id="lib">
    <div id="rows"></div>
  </main>
</div>
<input id="q" hidden><button id="played" hidden aria-pressed="false"></button><span id="dos-cmd" hidden></span><span id="dos-status" hidden></span>

<!-- Game page: open case + .exe file window -->
<div id="detail" class="detail-ov" hidden role="dialog" aria-modal="true" aria-label="Disk case">
  <header class="topbar">
    <button class="back" id="d-back" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
      Back to library
    </button>
    <span id="d-crumb" style="font:400 13px/1 var(--mono);color:var(--muted)"></span>
  </header>
  <main class="detail">
    <img id="d-backdrop" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(60px) saturate(1.2);opacity:.3;transform:scale(1.3)">
    <div class="detail__inner">
      <div class="detail__visual">
        <div class="stage">
          <div id="d-stage-disk" class="stage__disk"></div>
          <div class="stage__case">
            <div class="case__hinge" aria-hidden="true"></div>
            <div id="d-case-front" class="case__front">
              <img id="d-case-img" alt="">
              <div class="case__top"><span>3½" Disk Edition</span><span id="d-case-code"></span></div>
              <div class="case__bottom">
                <div id="d-case-title" class="case__title"></div>
                <div id="d-case-sub" class="case__sub"></div>
              </div>
              <div class="case__glare" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="detail__info">
        <div id="d-genre" class="exe-kicker"></div>
        <h1 id="d-title" class="detail__title"></h1>
        <div class="exe-actions exe-actions--bare">
          <button id="d-run" class="exe-btn exe-btn--run exe-btn--lg" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z" fill="currentColor"/></svg><span id="d-run-t">Run</span></button>
          <button class="exe-btn exe-btn--outline exe-btn--lg" type="button">Verify disk</button>
          <button class="exe-btn exe-btn--icon exe-btn--lg" type="button" aria-label="Add to favourites">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 17s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 17 8c0 4.7-7 9-7 9z"/></svg>
          </button>
        </div>
        <div class="exe-window" style="max-width:none">
          <div class="exe-titlebar">
            <span id="d-win-path"></span>
            <span class="exe-controls" aria-hidden="true"><span></span><span></span><span></span></span>
          </div>
          <div class="exe-tabs" role="tablist" aria-label="Disk files">
            <button class="exe-tab" role="tab" aria-selected="true" aria-controls="d-panel-readme" type="button">README.TXT</button>
            <button class="exe-tab" role="tab" aria-selected="false" aria-controls="d-panel-files-wrap" type="button">Contents</button>
            <button class="exe-tab" role="tab" aria-selected="false" aria-controls="d-panel-props" type="button">Properties</button>
          </div>
          <div id="d-panel-readme" class="exe-panel" role="tabpanel"></div>
          <div id="d-panel-files-wrap" role="tabpanel" hidden><ul id="d-panel-files" class="exe-files"></ul></div>
          <div id="d-panel-props" role="tabpanel" hidden>
            <dl class="exe-props exe-props--roomy">
              <dt>Type</dt><dd>Application (.exe)</dd>
              <dt>Developer</dt><dd id="d-p-dev"></dd>
              <dt>Released</dt><dd id="d-p-year"></dd>
              <dt>Size on disk</dt><dd id="d-p-size"></dd>
              <dt>Last run</dt><dd>[LAST PLAYED]</dd>
            </dl>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <span class="label-mono">More from your library</span>
          <div id="d-also" class="chips"></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="dos-bar">
    <span id="d-dos-cmd"></span>
    <span id="d-dos-status"></span>
  </footer>
</div>

<script>/* this snippet has no nav menu; stub it so the Escape handler can still close the game page */var menu={hidden:true},more={focus:function(){}},setMenu=function(){};</script>
<script>/* rz-perf: mark on-screen showpieces so off-screen ones stay idle */
(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('is-vis',e.isIntersecting)})},{threshold:0}),q=0;
function scan(){q=0;var l=document.querySelectorAll('.ocase,.tv');for(var i=0;i<l.length;i++){var e=l[i];if(!e.__io){e.__io=1;io.observe(e)}}}
function sched(){if(!q)q=requestAnimationFrame(scan)}
function go(){new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});scan()}
if(document.body)go();else addEventListener('DOMContentLoaded',go);
})();</script>

/* ---------- floppy disk markup (from floppyHTML in floppy.js) ---------- */
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function floppyHTML(g, variant = ''){
  const vars = `--body:${g.body};--ink:${g.ink};--accent:${g.accent};--pos:${g.pos}`;
  return `
  <div class="floppy ${variant}" style="${vars}">
    <div class="floppy__body">
      <div class="floppy__shutter">
        <div class="floppy__slot"></div>
        <div class="floppy__path">A:\\GAMES\\<br>${esc(g.file)}</div>
        <div class="floppy__diskno">DISK ${g.disk}/${String(TOTAL).padStart(2,'0')}</div>
      </div>
      <svg class="floppy__arrow" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9 6H6.5v3h-3V6H1z"/></svg>

}

const $ = s => document.querySelector(s);
const q = $('#q'), pb = $('#played'), lib = $('#lib');
let order = GAMES.slice();        // display order (Shuffle changes this)

const byId = id => GAMES.find(g => g.id === id);
const gb = list => list.reduce((n,g) => n + parseFloat(g.size), 0);
let cat = 'all';
const CATS = {
  all: () => true,
  action: g => /action|roguelike|metroidvania|platformer/i.test(g.genre),
  rpg: g => /rpg/i.test(g.genre),
  strategy: g => /strateg|tactics|4x/i.test(g.genre) || ['fm24','bg3'].includes(g.id),
  racing: g => /racing/i.test(g.genre),
  indie: g => ['hollowknight','stardew','celeste','subnautica','hades','disco','itb','ittakes2'].includes(g.id),
  sports: g => ['fc25','nba2k25','fm24'].includes(g.id),
  adventure: g => /adventure|open-world|detective|survival/i.test(g.genre)
};
function visible(){
  const v = q.value.trim().toLowerCase(), only = pb.getAttribute('aria-pressed') === 'true';
  return order.filter(g => (g.title+' '+g.genre+' '+g.dev+' '+g.file).toLowerCase().includes(v) && !(only && g.un) && CATS[cat](g));
}

const OC_IDS = ['cp2077','civ6','rdr2','hades','subnautica','sekiro','eldenring','fh5','bg3','witcher3'];
const OC_GLYPHS = ['<svg viewBox="0 0 20 20"><path d="M10 3v14M3.5 6.5l13 7M3.5 13.5l13-7"/></svg>','<svg viewBox="0 0 20 20"><path d="M10 3l2 5 5 .5-4 3.5 1.3 5L10 14l-4.3 3 1.3-5-4-3.5 5-.5z"/></svg>','<svg viewBox="0 0 20 20"><path d="M4 8c3-4 5 4 8 0s3 4 4 1M4 14c3-4 5 4 8 0"/></svg>','<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/></svg>'];

/* geometry of the plastic, in a 2100 x 1000 box */
const ocRR = (x,y,w,h,[a,b,c,d]) => `M${x+a} ${y}H${x+w-b}${b?`A${b} ${b} 0 0 1 ${x+w} ${y+b}`:''}V${y+h-c}${c?`A${c} ${c} 0 0 1 ${x+w-c} ${y+h}`:''}H${x+d}${d?`A${d} ${d} 0 0 1 ${x} ${y+h-d}`:''}V${y+a}${a?`A${a} ${a} 0 0 1 ${x+a} ${y}`:''}Z`;
const R4 = r => [r,r,r,r];
const OCG = {
  lidOut: ocRR(20,20,980,960,[50,12,12,50]),
  lidWin: ocRR(64,64,894,872,R4(16)),
  trayOut: ocRR(1070,20,1010,960,[12,50,50,12]),
  trayWin: ocRR(1112,64,926,872,R4(16))
};
const ocStreak = (x0,w) => `${x0},-20 ${x0+w},-20 ${x0+w-340},1020 ${x0-340},1020`;
const ocClip = (x0,y0,x1,y1) => [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]
  .map(([x,y,sx,sy]) => `<use href="#ocClipL" transform="translate(${x} ${y}) scale(${sx} ${sy})"/>`).join('');
const P = (d,w=1.4,extra='') => `<path d="${d}" stroke-width="${w}" ${extra}/>`;
const cap = (x,y,w,h,w1=1.6) => P(ocRR(x,y,w,h,R4(Math.min(w,h)/2)),w1);
const boxR = (x,y,w,h,r,w1=1.6) => P(ocRR(x,y,w,h,R4(r)),w1);

/* every molded edge of the case, drawn as fine bright lines (clear plastic only shows its edges) */
const ocLineArt = (() => {
  let s = '';
  // lid
  s += P(OCG.lidOut,2.4) + P(ocRR(31,31,958,938,[41,8,8,41]),1.1) + P(OCG.lidWin,2.2) + P(ocRR(73,73,876,854,R4(12)),1);
  s += cap(230,34,520,20) + cap(230,946,520,20) + cap(262,40,456,8,1) + cap(262,952,456,8,1);
  s += boxR(912,48,82,176,12) + boxR(924,62,58,148,9,1) + boxR(896,96,30,64,6,1.2) + boxR(912,776,82,176,12) + boxR(924,790,58,148,9,1) + boxR(896,840,30,64,6,1.2);
  s += boxR(912,350,82,300,12,1.4) + boxR(930,370,46,260,8,1);
  // hinge assembly
  s += cap(1004,58,62,182,2) + cap(1012,66,46,166,1) + cap(1004,760,62,182,2) + cap(1012,768,46,166,1);
  s += `<circle cx="1035" cy="149" r="16" stroke-width="2"/><circle cx="1035" cy="149" r="7" stroke-width="1.4"/><circle cx="1035" cy="851" r="16" stroke-width="2"/><circle cx="1035" cy="851" r="7" stroke-width="1.4"/>`;
  s += cap(1020,262,30,476,1.6) + cap(1027,270,16,460,1);
  s += boxR(1002,300,66,10,3,1) + boxR(1002,690,66,10,3,1);
  // tray
  s += P(OCG.trayOut,2.4) + P(ocRR(1081,31,988,938,[8,41,41,8]),1.1) + P(OCG.trayWin,2.2) + P(ocRR(1121,73,908,854,R4(12)),1);
  s += boxR(1076,48,26,176,8,1.4) + boxR(1076,350,26,300,8,1.4) + boxR(1076,776,26,176,8,1.4);
  s += cap(1390,34,580,20) + cap(1420,40,520,8,1);
  s += cap(2056,300,16,400,1.4) + cap(2060,320,8,360,1);
  s += `<path d="M1330 944L1366 886Q1370 880 1378 880H1862Q1870 880 1874 886L1910 944" stroke-width="2"/><path d="M1348 938L1378 894H1862L1892 938" stroke-width="1.1"/><path d="M1400 960H1840" stroke-width="1.2"/>`;
  // screw bosses at the tray corners
  [[1976,64,[0,16,0,0]],[1976,874,[0,0,16,0]]].forEach(([x,y,r]) => { s += P(ocRR(x,y,62,62,r),1.8); const cy=y+31; s += `<circle cx="${x+31}" cy="${cy}" r="17" stroke-width="1.8"/><circle cx="${x+31}" cy="${cy}" r="8" stroke-width="1.2"/>`; });
  s += boxR(1196,64,58,58,0,1.2) + boxR(1196,878,58,58,0,1.2);
  // concentric ring moulded into the tray around the disc
  s += `<circle cx="1617" cy="500" r="408" stroke-width="1.4" opacity=".7"/><circle cx="1617" cy="500" r="400" stroke-width="1" opacity=".5"/>`;
  // light catching on the edges
  s += `<g stroke="#fff" stroke-width="5">
    <path d="M24 150Q22 26 150 22" opacity=".95"/><path d="M1076 70Q1074 26 1100 24" opacity=".6"/>
    <path d="M2076 130Q2076 26 1960 24" opacity=".9"/><path d="M2078 330V640" opacity=".55" stroke-width="4"/>
    <path d="M26 870Q24 972 130 976" opacity=".7"/><path d="M1994 976Q2072 972 2076 880" opacity=".6"/>
    <path d="M300 22H640" opacity=".55" stroke-width="3.5"/><path d="M1500 22H1800" opacity=".5" stroke-width="3.5"/></g>`;
  return s;
})();

const ocDefs = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="ocLineG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2100" y2="1000"><stop offset="0" stop-color="#fff" stop-opacity=".98"/><stop offset=".3" stop-color="#e8f0f8" stop-opacity=".62"/><stop offset=".58" stop-color="#fff" stop-opacity=".9"/><stop offset=".8" stop-color="#e8f0f8" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></linearGradient>
  <linearGradient id="ocRimSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".12" stop-color="#dfeaf5" stop-opacity=".07"/><stop offset=".88" stop-color="#dfeaf5" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".14"/></linearGradient>
  <linearGradient id="ocCyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".02"/><stop offset=".22" stop-color="#fff" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity=".34"/><stop offset=".62" stop-color="#fff" stop-opacity=".08"/><stop offset=".9" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
  <linearGradient id="ocStreak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="ocSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="ocGlow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.2"/></filter>
  <filter id="ocBlur14" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="ocCpLid"><path d="${OCG.lidWin}"/></clipPath>
  <clipPath id="ocCpTray"><path d="${OCG.trayWin}"/></clipPath>
  <path id="ocClipL" d="M0 0H50V20Q50 22 48 22H22V48Q22 50 20 50H0Z" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.92)" stroke-width="1.8"/>
  <g id="ocLines" fill="none" stroke="url(#ocLineG)" stroke-linejoin="round" stroke-linecap="round">${ocLineArt}</g>
</defs></svg>`;

/* plastic beneath the disc: tray hub, drawn as moulded edges */
const ocHub = (() => {
  let t = '';
  for (let i = 0; i < 12; i++) t += `<g transform="rotate(${i*30})"><rect x="-14" y="-114" width="28" height="44" rx="12" fill="rgba(255,255,255,.07)" stroke-width="1.8"/><rect x="-7" y="-106" width="14" height="28" rx="6" stroke-width="1"/></g>`;
  return `<svg class="oc-svg" viewBox="0 0 2100 1000" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(1617 500)" fill="none" stroke="rgba(255,255,255,.9)">
    <circle r="132" fill="rgba(255,255,255,.05)" stroke-width="2.2"/><circle r="124" stroke-width="1" opacity=".6"/><circle r="116" stroke-width="1.2" opacity=".7"/>
    ${t}
    <circle r="66" fill="rgba(255,255,255,.1)" stroke-width="2.4"/><circle r="58" stroke-width="1.2"/><circle r="40" stroke-width="2"/><circle r="30" fill="rgba(0,0,0,.35)" stroke-width="1.4"/>
  </g></svg>`;
})();

/* plastic above everything: transparent bodies, edge lines, reflections */
const ocPlastic = `<svg class="oc-svg" viewBox="0 0 2100 1000" preserveAspectRatio="none" aria-hidden="true">
  <path d="${OCG.lidOut} ${OCG.lidWin}" fill="url(#ocRimSoft)" fill-rule="evenodd"/>
  <path d="${OCG.trayOut} ${OCG.trayWin}" fill="url(#ocRimSoft)" fill-rule="evenodd"/>
  <rect x="1000" y="20" width="70" height="960" fill="url(#ocCyl)" opacity=".5"/>
  <rect x="1004" y="58" width="62" height="182" rx="31" fill="url(#ocCyl)"/><rect x="1004" y="760" width="62" height="182" rx="31" fill="url(#ocCyl)"/>
  <!-- soft glow inside each window edge -->
  <g clip-path="url(#ocCpLid)"><path d="${OCG.lidWin}" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="40" filter="url(#ocBlur14)"/></g>
  <g clip-path="url(#ocCpTray)"><path d="${OCG.trayWin}" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="40" filter="url(#ocBlur14)"/></g>

// Label style rotates block → tag → paper → stripe; each case gets its own
// misalignment, glare position and wear so the stack looks hand-piled.
(function () {
  const JL = [0, 7, -5, 10, 3, -7, 6, -2, 9, 1];
  const JR = [6, -3, 9, -6, 2, 8, -4, 5, -2, 7];
  const WEAR = [0.6, 1, 0.8, 0.5, 1, 0.7, 0.9, 0.6, 1, 0.75];
  const STYLES = ["block", "tag", "paper", "stripe"];

  function label(g, style, num) {
    switch (style) {
      case "block":
        return `<div class="lbl lbl--block">
          <div class="lbl__num mono"><span class="vert--up">${num}</span></div>
          <div class="lbl__title">${g.title}</div>
          <img src="${g.img}" alt="">
          <div class="lbl__code mono"><span class="vert">${g.code}</span></div>
        </div>`;
      case "tag":
        return `<div class="lbl lbl--tag">
          <img src="${g.img}" alt="">
          <div class="lbl__title">${g.title}</div>
          <div class="lbl__code mono"><span class="vert">${g.code}</span></div>
        </div>`;
      case "paper":
        return `<div class="lbl lbl--paper">
          <div class="lbl__text mono">
            <div class="lbl__title">${g.title}</div>
            <div class="lbl__sub">${g.year}NO:${num}</div>
          </div>
          <img src="${g.img}" alt="">
          <span class="lbl__code mono vert">${g.code}</span>
        </div>`;
      default:
        return `<div class="lbl lbl--stripe">
          <div class="lbl__num"><span class="vert--up">${num}</span></div>
          <div class="lbl__body">
            <div class="lbl__lines"><span class="lbl__title">${g.title}</span><span class="lbl__dev">${g.dev}</span></div>
            <span class="lbl__code">${g.code}</span>
          </div>
          <img src="${g.img}" alt="">
        </div>`;
    }
  }

  window.tapeHTML = function (g, i) {
    const style = STYLES[i % 4];
    const num = String(i + 1).padStart(2, "0");
    const edge = style === "paper" ? "#f1efe8" : style === "tag" ? g.accent : g.body;
    const s = 12 + (i * 23) % 60;
    const vars = [
      `--body:${g.body}`, `--ink:${g.ink}`, `--accent:${g.accent}`, `--band:${g.band}`,
      `--edge:${edge}`, `--jl:${JL[i % 10]}`, `--jr:${JR[i % 10]}`, `--wear:${WEAR[i % 10]}`,
      `--s1:${s}%`, `--s2:${s + 5}%`, `--s3:${s + 10}%`, `--s4:${s + 16}%`
    ].join(";");

    return `<div class="tape" style="${vars}">
      <div class="tape__shell" aria-hidden="true"></div>
      <div class="tape__lip tape__lip--top" aria-hidden="true"></div>
      <div class="tape__lip tape__lip--bottom" aria-hidden="true"></div>
      <div class="tape__seam tape__seam--top" aria-hidden="true"></div>
      <div class="tape__seam tape__seam--bottom" aria-hidden="true"></div>
      <div class="tape__window">
        ${label(g, style, num)}
        <div class="tape__glass" aria-hidden="true"></div>
      </div>
      <div class="tape__cap tape__cap--left" aria-hidden="true"><div class="tape__ridge"></div><div class="tape__ridge tape__ridge--in"></div></div>
      <div class="tape__cap tape__cap--right" aria-hidden="true"><div class="tape__notch"></div></div>
      <div class="tape__wear" aria-hidden="true"></div>
      <div class="tape__pointer" aria-hidden="true"></div>
    </div>`;
  };
})();
